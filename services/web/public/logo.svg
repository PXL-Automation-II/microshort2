<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="microshort">
  <title>microshort</title>
  <!-- Same family as PXL Classroom and PXL CloudLabs: rounded pixel squares on
       the PXL rainbow, drawn on the CloudLabs 5.6-unit grid (4.8 cells).
       A long, fading trail of single pixels (the long URL) compresses into one
       solid pixel arrow (the short link). -->
  <defs>
    <linearGradient id="pxl-short-a" x1="0" y1="44" x2="64" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="0.22" stop-color="#eab308"/>
      <stop offset="0.42" stop-color="#f97316"/>
      <stop offset="0.68" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <g fill="url(#pxl-short-a)">
    <!-- the long URL: a trail that fades in from the left -->
    <rect x="0.8"  y="33.4" width="3.6" height="3.6" rx="0.8" fill-opacity="0.30"/>
    <rect x="6.0"  y="32.8" width="4.8" height="4.8" rx="1.0" fill-opacity="0.50"/>
    <rect x="11.6" y="32.8" width="4.8" height="4.8" rx="1.0" fill-opacity="0.70"/>
    <rect x="17.2" y="32.8" width="4.8" height="4.8" rx="1.0" fill-opacity="0.85"/>
    <!-- the short link: a solid arrow, three cells tall -->
    <rect x="22.8" y="27.2" width="4.8" height="4.8" rx="1.0"/>
    <rect x="22.8" y="32.8" width="4.8" height="4.8" rx="1.0"/>
    <rect x="22.8" y="38.4" width="4.8" height="4.8" rx="1.0"/>
    <rect x="28.4" y="27.2" width="4.8" height="4.8" rx="1.0"/>
    <rect x="28.4" y="32.8" width="4.8" height="4.8" rx="1.0"/>
    <rect x="28.4" y="38.4" width="4.8" height="4.8" rx="1.0"/>
    <rect x="34.0" y="27.2" width="4.8" height="4.8" rx="1.0"/>
    <rect x="34.0" y="32.8" width="4.8" height="4.8" rx="1.0"/>
    <rect x="34.0" y="38.4" width="4.8" height="4.8" rx="1.0"/>
    <!-- arrow head -->
    <rect x="39.6" y="16.0" width="4.8" height="4.8" rx="1.0"/>
    <rect x="39.6" y="21.6" width="4.8" height="4.8" rx="1.0"/>
    <rect x="39.6" y="27.2" width="4.8" height="4.8" rx="1.0"/>
    <rect x="39.6" y="32.8" width="4.8" height="4.8" rx="1.0"/>
    <rect x="39.6" y="38.4" width="4.8" height="4.8" rx="1.0"/>
    <rect x="39.6" y="44.0" width="4.8" height="4.8" rx="1.0"/>
    <rect x="39.6" y="49.6" width="4.8" height="4.8" rx="1.0"/>
    <rect x="45.2" y="21.6" width="4.8" height="4.8" rx="1.0"/>
    <rect x="45.2" y="27.2" width="4.8" height="4.8" rx="1.0"/>
    <rect x="45.2" y="32.8" width="4.8" height="4.8" rx="1.0"/>
    <rect x="45.2" y="38.4" width="4.8" height="4.8" rx="1.0"/>
    <rect x="45.2" y="44.0" width="4.8" height="4.8" rx="1.0"/>
    <rect x="50.8" y="27.2" width="4.8" height="4.8" rx="1.0"/>
    <rect x="50.8" y="32.8" width="4.8" height="4.8" rx="1.0"/>
    <rect x="50.8" y="38.4" width="4.8" height="4.8" rx="1.0"/>
    <rect x="56.4" y="32.8" width="4.8" height="4.8" rx="1.0"/>
  </g>
</svg>
