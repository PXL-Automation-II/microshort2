name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/microshort2

jobs:
  unit:
    name: Unit tests / build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            cmd: npm test
          - service: redirect
            cmd: npm test
          - service: web
            cmd: npm run build   # type-check + bundle
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: ${{ matrix.cmd }}

  integration:
    name: Integration tests (compose)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Create .env for the reference stack
        run: cp .env.example .env
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - run: npm ci
      - run: npm test
      - name: Rate-limit profile
        run: |
          docker compose -f compose.yml -f compose.test.override.yml down -v
          docker compose -f compose.yml -f compose.test.override.yml up -d --build --wait --wait-timeout 180
          npm run test:rate
      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.yml -f compose.test.override.yml logs --no-color
      - if: always()
        run: docker compose -f compose.yml -f compose.test.override.yml down -v

  release:
    name: Release tarball
    runs-on: ubuntu-latest
    needs: integration
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the dashboard
        working-directory: services/web
        run: npm ci && npm run build
      - name: Pack the three services (web built, no node_modules, no sources of web)
        run: |
          TAG=${GITHUB_REF_NAME}
          STAGE=$(mktemp -d)/microshort2-$TAG
          mkdir -p "$STAGE/services"
          for s in api redirect; do
            mkdir -p "$STAGE/services/$s"
            cp -r services/$s/package.json services/$s/package-lock.json services/$s/src "$STAGE/services/$s/"
          done
          mkdir -p "$STAGE/services/web"
          cp -r services/web/package.json services/web/package-lock.json services/web/server.js services/web/dist "$STAGE/services/web/"
          cp DEPLOYMENT-CONTRACT.md LICENSE README.md "$STAGE/"
          tar -C "$(dirname "$STAGE")" -czf "microshort2-$TAG.tar.gz" "microshort2-$TAG"
          sha256sum "microshort2-$TAG.tar.gz" > "microshort2-$TAG.tar.gz.sha256"
          ls -l microshort2-$TAG.tar.gz*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF_NAME}
          gh release create "$TAG" --title "microshort 2 $TAG" --notes "Release tarball: unpack, npm ci --omit=dev in each service, run as DEPLOYMENT-CONTRACT.md section 1 says." "microshort2-$TAG.tar.gz" "microshort2-$TAG.tar.gz.sha256"

  publish:
    name: Publish image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: integration
    if: github.event_name == 'push'
    strategy:
      matrix:
        service: [api, redirect, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
